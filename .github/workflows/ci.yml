name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS only: streamlit_app imports mlx_audio at module load, and uv.lock
    # pins mlx-metal to sys_platform == 'darwin'. Free on public repos.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

      # torchcodec dlopen()s FFmpeg's shared libs at import and macos-latest no
      # longer ships them. After ty so the fast checks fail before the install.
      - run: brew install ffmpeg

      - run: uv run pytest -q
