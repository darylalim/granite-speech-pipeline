[server]
maxUploadSize = 500

# No [theme] section on purpose: the app uses Streamlit's built-in light and
# dark themes, so the settings menu offers Light / Dark / System. Every theme
# option defaults to None (unset), which is what tells the frontend to apply its
# own palette — writing the default values back in would not be equivalent.
# Note a *custom* theme locks the app to one mode unless it defines both
# [theme.light] and [theme.dark]; that constraint does not apply here.
